<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Newsletter Subscribers — SHEREBLOG NEWS Admin</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="/admin/css/admin.css" />
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-sidebar" id="admin-sidebar-mount"></aside>
    <div class="admin-main">
      <header class="admin-topbar" id="admin-topbar-mount"></header>
      <div class="admin-content">

        <div class="a-toolbar">
          <div class="a-search-input"><input class="a-input" type="search" id="search-input" placeholder="Search by email..." /></div>
          <select class="a-select" id="status-filter">
            <option value="">All statuses</option>
            <option value="confirmed">Confirmed</option>
            <option value="pending">Pending confirmation</option>
            <option value="unsubscribed">Unsubscribed</option>
          </select>
          <div style="flex:1;"></div>
          <button class="a-btn a-btn-ghost" id="export-btn">Export CSV</button>
        </div>

        <div class="a-card">
          <div class="a-table-wrap">
            <table class="a-table">
              <thead>
                <tr>
                  <th>Email</th>
                  <th>Status</th>
                  <th>Subscribed</th>
                  <th>Unsubscribed</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="subscribers-table-body">
                <tr class="a-skeleton-row"><td colspan="5"><div class="a-skeleton"></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <div class="a-pagination">
          <span id="pagination-info"></span>
          <button class="a-btn a-btn-ghost a-btn-sm" id="prev-page-btn">Previous</button>
          <button class="a-btn a-btn-ghost a-btn-sm" id="next-page-btn">Next</button>
        </div>

      </div>
    </div>
  </div>

  <script src="/admin/js/admin-api.js"></script>
  <script src="/admin/js/admin-utils.js"></script>
  <script src="/admin/js/auth-guard.js"></script>
  <script src="/admin/js/admin-layout.js"></script>
  <script src="/admin/js/subscribers.js"></script>
</body>
</html>
