<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Category — SHEREBLOG NEWS</title>
  <meta name="description" id="meta-description" content="" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/cards.css" />
</head>
<body>
  <div id="site-header-mount"></div>

  <main id="main-content">
    <section class="section" style="padding-bottom: var(--space-4);">
      <div class="container">
        <div class="eyebrow" style="color:var(--brass);margin-bottom:8px;">Category</div>
        <h1 id="category-title" style="font-family:var(--font-display); font-size:2.4rem; margin:0 0 8px;">
          <span class="skeleton" style="display:inline-block;width:220px;height:36px;"></span>
        </h1>
        <p id="category-description" style="color:var(--slate); max-width:60ch; margin:0;"></p>
      </div>
    </section>

    <section class="section" style="padding-top:0;">
      <div class="container">
        <div class="news-grid" id="category-grid"></div>
        <div class="load-more-wrap">
          <button class="btn btn-ghost" id="load-more-btn" style="display:none;">Load More</button>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer-mount"></div>

  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/cards.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/category.js"></script>
</body>
</html>
